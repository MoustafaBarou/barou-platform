---
name: CI

"on":
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.15.8"
  PYTHON_VERSION: "3.12"

jobs:
  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "${{ env.TERRAFORM_VERSION }}"

      - name: Run Terraform validation
        run: ./scripts/validate.sh terraform

  ansible:
    name: Ansible validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: pip
          cache-dependency-path: configuration/ansible/requirements-ci.txt

      - name: Install Ansible development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --requirement configuration/ansible/requirements-ci.txt

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install \
            --requirements-file configuration/ansible/requirements.yml

      - name: Run Ansible validation
        run: ./scripts/validate.sh ansible
