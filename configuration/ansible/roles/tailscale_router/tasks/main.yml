---
- name: Install Tailscale repository dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Create Tailscale APT keyring directory
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Tailscale repository signing key
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    owner: root
    group: root
    mode: "0644"

- name: Configure Tailscale APT repository
  ansible.builtin.deb822_repository:
    name: tailscale
    types:
      - deb
    uris:
      - https://pkgs.tailscale.com/stable/ubuntu
    suites:
      - noble
    components:
      - main
    signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
    state: present

- name: Install Tailscale
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true

- name: Ensure tailscaled is enabled and running
  ansible.builtin.systemd_service:
    name: tailscaled
    state: started
    enabled: true

- name: Configure IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_set: true
    reload: true
  when: tailscale_router_ipv4_forwarding

- name: Configure IPv6 forwarding
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    state: present
    sysctl_set: true
    reload: true
  when: tailscale_router_ipv6_forwarding

- name: Allow routed traffic from Tailscale to homelab LAN
  community.general.ufw:
    rule: allow
    route: true
    interface_in: "{{ tailscale_router_interface }}"
    interface_out: "{{ tailscale_router_lan_interface }}"
    to_ip: "{{ tailscale_router_lan_subnet }}"

- name: Check Tailscale backend state
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_router_status
  changed_when: false
  when: not ansible_check_mode

- name: Parse Tailscale backend state
  ansible.builtin.set_fact:
    tailscale_router_backend_state: >-
      {{
        (tailscale_router_status.stdout | from_json).BackendState
        | default('Unknown')
      }}
  when: not ansible_check_mode

- name: Verify Tailscale is authenticated
  ansible.builtin.assert:
    that:
      - tailscale_router_backend_state == "Running"
    fail_msg: >-
      Tailscale is not authenticated or running.
      Current BackendState: {{ tailscale_router_backend_state }}
  when: not ansible_check_mode

- name: Advertise homelab subnet route
  ansible.builtin.command:
    cmd: >-
      tailscale set
      --advertise-routes={{ tailscale_router_advertise_routes | join(',') }}
  changed_when: false
  when: not ansible_check_mode
