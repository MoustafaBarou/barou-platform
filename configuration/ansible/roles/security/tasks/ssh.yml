---
- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: "PasswordAuthentication {{ security_sshd_password_authentication }}"
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH

- name: Disable SSH root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: "PermitRootLogin {{ security_sshd_permit_root_login }}"
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH

- name: Ensure SSH public key authentication is enabled
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PubkeyAuthentication'
    line: "PubkeyAuthentication {{ security_sshd_pubkey_authentication }}"
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH

- name: Disable SSH empty passwords
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitEmptyPasswords'
    line: "PermitEmptyPasswords {{ security_sshd_permit_empty_passwords }}"
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH

- name: Disable SSH X11 forwarding
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?X11Forwarding'
    line: "X11Forwarding {{ security_sshd_x11_forwarding }}"
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH

- name: Limit SSH authentication attempts
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?MaxAuthTries'
    line: "MaxAuthTries {{ security_sshd_max_auth_tries }}"
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH

- name: Configure SSH client keepalive interval
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?ClientAliveInterval'
    line: "ClientAliveInterval {{ security_sshd_client_alive_interval }}"
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH

- name: Configure SSH client keepalive count
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?ClientAliveCountMax'
    line: "ClientAliveCountMax {{ security_sshd_client_alive_count_max }}"
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH
