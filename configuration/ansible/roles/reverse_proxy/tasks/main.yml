---
- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

- name: Deploy Caddy configuration
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
    validate: "caddy validate --config %s --adapter caddyfile"
  notify: Reload Caddy

- name: Ensure Caddy is enabled and running
  ansible.builtin.systemd_service:
    name: caddy
    state: started
    enabled: true

- name: Allow HTTPS from Tailscale
  community.general.ufw:
    rule: allow
    interface_in: tailscale0
    port: "443"
    proto: tcp

- name: Allow HTTP from Tailscale
  community.general.ufw:
    rule: allow
    interface_in: tailscale0
    port: "80"
    proto: tcp

- name: Allow HTTPS from homelab LAN
  community.general.ufw:
    rule: allow
    interface_in: eth0
    from_ip: 192.168.178.0/24
    port: "443"
    proto: tcp

- name: Allow HTTP from homelab LAN
  community.general.ufw:
    rule: allow
    interface_in: eth0
    from_ip: 192.168.178.0/24
    port: "80"
    proto: tcp
