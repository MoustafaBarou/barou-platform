hostname: rancher.lab.barouconsulting.nl

replicas: 1

ingress:
  enabled: true
  ingressClassName: nginx

tls: external

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

extraNodeSelectorTerms:
  - key: kubernetes.io/hostname
    operator: In
    values:
      - k8s-worker-01
