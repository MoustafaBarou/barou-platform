---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/part-of: barou-platform

spec:
  replicas: 1

  strategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app.kubernetes.io/name: homepage

  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
        app.kubernetes.io/part-of: barou-platform

    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true

      nodeSelector:
        kubernetes.io/hostname: k8s-worker-01

      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.13.2
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: platform.lab.barouconsulting.nl

            - name: HOMEPAGE_VAR_PROXMOX_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: homepage-proxmox
                  key: token-id

            - name: HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: homepage-proxmox
                  key: token-secret

            - name: HOMEPAGE_VAR_GITEA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homepage-gitea
                  key: api-token

            - name: HOMEPAGE_VAR_JENKINS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: homepage-jenkins
                  key: username

            - name: HOMEPAGE_VAR_JENKINS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homepage-jenkins
                  key: api-token

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: homepage-config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml

            - name: homepage-config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml

            - name: homepage-config
              mountPath: /app/config/services.yaml
              subPath: services.yaml

            - name: homepage-config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml

            - name: homepage-config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml

            - name: homepage-config
              mountPath: /app/config/docker.yaml
              subPath: docker.yaml

            - name: homepage-config
              mountPath: /app/config/proxmox.yaml
              subPath: proxmox.yaml

      volumes:
        - name: homepage-config
          configMap:
            name: homepage-config
