---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/part-of: barou-platform

data:
  kubernetes.yaml: |
    mode: cluster
    ingress: true

  settings.yaml: |
    title: Barou Platform
    theme: dark
    color: slate
    headerStyle: clean
    target: _blank
    disableIndexing: true

    layout:
      Platform:
        style: row
        columns: 3

      Infrastructure:
        style: row
        columns: 3

  services.yaml: |
    - Platform:
        - Rancher:
            icon: rancher.png
            href: https://rancher.lab.barouconsulting.nl
            description: Kubernetes management platform

        - Kubernetes:
            icon: kubernetes.png
            description: RKE2 Kubernetes cluster
            namespace: kube-system
            podSelector: app.kubernetes.io/name=rke2-coredns

    - Infrastructure:
        - Proxmox:
            icon: proxmox.png
            href: https://proxmox.lab.barouconsulting.nl
            description: Virtualization platform
            widget:
              type: proxmox
              url: https://192.168.178.10:8006
              username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}"
              password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
              node: pve
              fields:
                - vms
                - lxc
                - resources.cpu
                - resources.mem

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: Barou Platform

        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short

  bookmarks.yaml: |
    - Documentation:
        - GitHub Repository:
            - icon: github.png
              href: https://github.com/MoustafaBarou/barou-platform

  docker.yaml: ""

  proxmox.yaml: ""
